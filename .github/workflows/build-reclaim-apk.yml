name: Build Reclaim Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate missing Android Gradle files for current Flutter SDK
        run: flutter create --platforms=android --org com.reclaim --project-name reclaim_mobile .

      - name: Install Flutter packages
        run: flutter pub get

      - name: Run Flutter unit and widget tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Reclaim APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
